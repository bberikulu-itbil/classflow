<style>
/* ClassFlow loader: the CF cube builds itself face by face, holds, fades, repeats (also used by src/ui/Loading.tsx) */
.cf-load{display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:600 15px Inter,system-ui,sans-serif;color:#5A606B}
.cf-load svg{width:84px;height:84px;overflow:visible}
.cf-load path{transform-box:fill-box;transform-origin:center;animation:cf-build 2.2s cubic-bezier(.2,.8,.2,1) infinite both}
.cf-load .t{--from:translate(0,-38%)}
.cf-load .l{--from:translate(-38%,0);animation-delay:.18s}
.cf-load .f{--from:translate(38%,0);animation-delay:.36s}
@keyframes cf-build{0%{opacity:0;transform:var(--from) scale(.9)}22%{opacity:1;transform:none}72%{opacity:1;transform:none}90%,100%{opacity:0;transform:scale(.96)}}
.cf-load .dots{padding-left:1.2em}.cf-load .dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:cf-dots 1.2s steps(4) infinite}
@keyframes cf-dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion:reduce){.cf-load path{animation:cf-pulse 1.6s ease-in-out infinite}.cf-load .l,.cf-load .f{animation-delay:0s}}
@keyframes cf-pulse{50%{opacity:.45}}
</style>
</head>
