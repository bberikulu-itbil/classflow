<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Segment length</title><desc id="d">Coordinate differences form a right triangle and the distance is calculated by the Pythagorean theorem.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><path d="M120 290H420V100" fill="none" stroke="#2563eb" stroke-width="8"/><path d="M120 290L420 100" fill="none" stroke="#0f766e" stroke-width="10"/><text x="70" y="345" font-family="Arial" font-size="28" fill="#0f172a">A(x1,y1)</text><text x="430" y="90" font-family="Arial" font-size="28" fill="#0f172a">B(x2,y2)</text><text x="250" y="330" font-family="Arial" font-size="28" fill="#2563eb">dx = x2 - x1</text><text x="445" y="220" font-family="Arial" font-size="28" fill="#2563eb">dy</text><text x="690" y="165" font-family="Arial" font-size="32" fill="#0f172a">d = sqrt(dx² + dy²)</text><path d="M650 215H1090" stroke="#cbd5e1" stroke-width="4"/><text x="690" y="275" font-family="Arial" font-size="28" fill="#475569">read → subtract → square → add → sqrt</text></svg>
