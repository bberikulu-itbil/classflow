<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Inter,Arial,sans-serif"><rect x="0" y="0" width="640" height="300" rx="22" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><rect x="24" y="30" width="188" height="230" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/><text x="118" y="112" font-size="46" fill="#7C3AED" font-weight="900" text-anchor="middle" font-family="ui-monospace,monospace">NULL</text><text x="118" y="170" font-size="17" fill="#0F172A" font-weight="900" text-anchor="middle">no value at all</text><text x="118" y="200" font-size="13" fill="#64748B" font-weight="500" text-anchor="middle">we do not know it</text><rect x="226" y="30" width="188" height="230" rx="18" fill="#E0F2FE" stroke="#2563EB" stroke-width="3"/><text x="320" y="112" font-size="46" fill="#2563EB" font-weight="900" text-anchor="middle" font-family="ui-monospace,monospace">0</text><text x="320" y="170" font-size="17" fill="#0F172A" font-weight="900" text-anchor="middle">a number</text><text x="320" y="200" font-size="13" fill="#64748B" font-weight="500" text-anchor="middle">we know it is zero</text><rect x="428" y="30" width="188" height="230" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/><text x="522" y="112" font-size="46" fill="#F59E0B" font-weight="900" text-anchor="middle" font-family="ui-monospace,monospace">''</text><text x="522" y="170" font-size="17" fill="#0F172A" font-weight="900" text-anchor="middle">an empty text</text><text x="522" y="200" font-size="13" fill="#64748B" font-weight="500" text-anchor="middle">a text with no letters</text><text x="320" y="288" font-size="18" fill="#0F172A" font-weight="900" text-anchor="middle">NULL ≠ 0 ≠ empty text</text></svg>