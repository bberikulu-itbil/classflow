<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Жақсы prompt формуласы</title><desc id="d">Prompt бес бөліктен тұрады: кім, не істейді, стиль, түс, фон.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="0" y="0" width="1200" height="420" rx="24" fill="#f8fafc" stroke="none" stroke-width="0"/><rect x="40" y="80" width="206" height="56" rx="12" fill="#2563eb" stroke="none" stroke-width="0"/><text x="143" y="117" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Кім / не</text><rect x="40" y="150" width="206" height="118" rx="12" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="143" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1e293b" text-anchor="middle">қызыл мысық</text><text x="256" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#475569" text-anchor="middle">+</text><rect x="266" y="80" width="206" height="56" rx="12" fill="#7c3aed" stroke="none" stroke-width="0"/><text x="369" y="117" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Не істейді</text><rect x="266" y="150" width="206" height="118" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="369" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1e293b" text-anchor="middle">қуанып тұр</text><text x="369" y="226" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1e293b" text-anchor="middle">көзілдірік киген</text><text x="482" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#475569" text-anchor="middle">+</text><rect x="492" y="80" width="206" height="56" rx="12" fill="#f97316" stroke="none" stroke-width="0"/><text x="595" y="117" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Стиль</text><rect x="492" y="150" width="206" height="118" rx="12" fill="#fff" stroke="#f97316" stroke-width="3"/><text x="595" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1e293b" text-anchor="middle">flat стикер</text><text x="595" y="226" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1e293b" text-anchor="middle">қалың контур</text><text x="708" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#475569" text-anchor="middle">+</text><rect x="718" y="80" width="206" height="56" rx="12" fill="#16a34a" stroke="none" stroke-width="0"/><text x="821" y="117" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Түс</text><rect x="718" y="150" width="206" height="118" rx="12" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="821" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1e293b" text-anchor="middle">3 түс</text><text x="934" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#475569" text-anchor="middle">+</text><rect x="944" y="80" width="206" height="56" rx="12" fill="#ec4899" stroke="none" stroke-width="0"/><text x="1047" y="117" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Фон</text><rect x="944" y="150" width="206" height="118" rx="12" fill="#fff" stroke="#ec4899" stroke-width="3"/><text x="1047" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1e293b" text-anchor="middle">ақ фон</text><text x="600" y="52" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">Prompt = 5 бөлік</text><line x1="600" y1="280" x2="600" y2="318" stroke="#475569" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="322" width="1080" height="70" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="600" y="366" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#1e293b" text-anchor="middle">«Көзілдірік киген қуанышты қызыл мысық, flat стикер стилі, қалың контур, 3 түс, ақ фон»</text></svg>
