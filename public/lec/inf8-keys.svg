<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Inter,Arial,sans-serif"><rect x="0" y="0" width="640" height="280" rx="22" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><rect x="40" y="60" width="130" height="80" rx="14" fill="#2563EB"/><text x="105" y="112" font-size="28" fill="#fff" font-weight="900" text-anchor="middle">Enter</text><text x="105" y="176" font-size="17" fill="#0F172A" font-weight="700" text-anchor="middle">↓ down</text><rect x="190" y="60" width="100" height="80" rx="14" fill="#7C3AED"/><text x="240" y="112" font-size="28" fill="#fff" font-weight="900" text-anchor="middle">Tab</text><text x="240" y="176" font-size="17" fill="#0F172A" font-weight="700" text-anchor="middle">→ right</text><rect x="340" y="60" width="100" height="80" rx="14" fill="#F59E0B"/><text x="390" y="112" font-size="28" fill="#fff" font-weight="900" text-anchor="middle">F2</text><text x="390" y="176" font-size="17" fill="#0F172A" font-weight="700" text-anchor="middle">edit</text><rect x="470" y="60" width="130" height="80" rx="14" fill="#E11D48"/><text x="535" y="112" font-size="28" fill="#fff" font-weight="900" text-anchor="middle">Delete</text><text x="535" y="176" font-size="17" fill="#0F172A" font-weight="700" text-anchor="middle">clear</text><text x="320" y="238" font-size="17" fill="#64748B" font-weight="500" text-anchor="middle">Press a cell, then type. Press = to start a formula.</text></svg>