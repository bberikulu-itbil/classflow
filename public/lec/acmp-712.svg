<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Diplomas</title><desc id="d">Binary search the smallest square side that fits n rectangles w by h.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><rect x="100" y="100" width="180" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/><text x="145" y="170" font-family="Arial" font-size="30" fill="#1e3a8a">w × h</text><path d="M280 160H440" stroke="#2563eb" stroke-width="7"/><rect x="440" y="90" width="250" height="140" rx="20" fill="#fef3c7"/><text x="490" y="150" font-family="Arial" font-size="29" fill="#92400e">side = s</text><text x="475" y="195" font-family="Arial" font-size="25" fill="#92400e">floor(s/w)·floor(s/h)</text><path d="M690 160H820" stroke="#0f766e" stroke-width="7"/><rect x="820" y="90" width="260" height="140" rx="20" fill="#dcfce7"/><text x="870" y="150" font-family="Arial" font-size="29" fill="#166534">capacity ≥ n?</text><text x="875" y="195" font-family="Arial" font-size="26" fill="#166534">yes → shrink s</text><text x="120" y="335" font-family="Arial" font-size="31" fill="#475569">answer = minimum feasible square side</text></svg>
