<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Sequence length</title><desc id="d">Read numbers until zero and count the non-zero values.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="80" y="80" font-family="Arial" font-size="34" fill="#0f172a">1 → 7 → 9 → 0</text><path d="M130 150H1030" stroke="#cbd5e1" stroke-width="6"/><circle cx="170" cy="150" r="20" fill="#2563eb"/><circle cx="420" cy="150" r="20" fill="#2563eb"/><circle cx="670" cy="150" r="20" fill="#2563eb"/><circle cx="920" cy="150" r="20" fill="#ef4444"/><text x="130" y="235" font-family="Arial" font-size="28" fill="#1e3a8a">count = 1</text><text x="380" y="235" font-family="Arial" font-size="28" fill="#1e3a8a">count = 2</text><text x="630" y="235" font-family="Arial" font-size="28" fill="#1e3a8a">count = 3</text><text x="860" y="235" font-family="Arial" font-size="28" fill="#b91c1c">stop</text><path d="M120 320H1080" stroke="#0f766e" stroke-width="8"/><text x="420" y="375" font-family="Arial" font-size="32" fill="#166534">do → read → count → while x ≠ 0</text></svg>
