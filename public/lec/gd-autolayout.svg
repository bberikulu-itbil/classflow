<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Auto layout: padding, gap, direction</title><desc id="d">Тік Auto layout: ішкі шет padding 16, элементтер арасы gap 12.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="0" y="0" width="1200" height="420" rx="24" fill="#f8fafc" stroke="none" stroke-width="0"/><rect x="120" y="40" width="460" height="340" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 6"/><rect x="150" y="70" width="400" height="80" rx="10" fill="#ddd6fe" stroke="none" stroke-width="0"/><text x="350" y="118" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#1e293b" text-anchor="middle">Элемент 1</text><rect x="150" y="162" width="400" height="80" rx="10" fill="#ddd6fe" stroke="none" stroke-width="0"/><text x="350" y="210" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#1e293b" text-anchor="middle">Элемент 2</text><rect x="150" y="254" width="400" height="80" rx="10" fill="#ddd6fe" stroke="none" stroke-width="0"/><text x="350" y="302" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#1e293b" text-anchor="middle">Элемент 3</text><rect x="120" y="150" width="30" height="40" rx="0" fill="#f97316" stroke="none" stroke-width="0" opacity="0.8"/><rect x="150" y="40" width="100" height="30" rx="0" fill="#f97316" stroke="none" stroke-width="0" opacity="0.8"/><rect x="300" y="150" width="100" height="12" rx="0" fill="#dc2626" stroke="none" stroke-width="0" opacity="0.9"/><rect x="640" y="50" width="480" height="52" rx="12" fill="#f97316" stroke="none" stroke-width="0"/><text x="880" y="85" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">padding — ішкі шет (16)</text><rect x="640" y="130" width="480" height="52" rx="12" fill="#dc2626" stroke="none" stroke-width="0"/><text x="880" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">gap — элементтер арасы (12)</text><rect x="640" y="210" width="480" height="52" rx="12" fill="#7c3aed" stroke="none" stroke-width="0"/><text x="880" y="245" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">direction — тік немесе көлденең ↓ →</text><rect x="640" y="290" width="480" height="52" rx="12" fill="#2563eb" stroke="none" stroke-width="0"/><text x="880" y="325" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Shift+A — қосу</text></svg>
