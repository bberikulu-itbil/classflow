<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Digit check</title><desc id="d">A character is a digit when it is between zero and nine.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="110" y="105" font-family="Arial" font-size="42" fill="#0f172a">c</text><path d="M135 120V220" stroke="#2563eb" stroke-width="6"/><path d="M135 220H430M135 220V330" stroke="#2563eb" stroke-width="6"/><rect x="430" y="175" width="310" height="90" rx="20" fill="#dbeafe"/><text x="480" y="230" font-family="Arial" font-size="31" fill="#1e3a8a">'0' ≤ c ≤ '9'</text><path d="M740 220H900M900 220V150M900 220V290" stroke="#0f766e" stroke-width="6"/><text x="920" y="158" font-family="Arial" font-size="30" fill="#166534">Yes</text><text x="920" y="300" font-family="Arial" font-size="30" fill="#b91c1c">No</text><text x="300" y="370" font-family="Arial" font-size="31" fill="#475569">ASCII range check</text></svg>
