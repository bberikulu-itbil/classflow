<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Case swap</title><desc id="d">Uppercase and lowercase letters are swapped by the ASCII offset.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><rect x="70" y="90" width="230" height="80" rx="16" fill="#dbeafe"/><text x="125" y="142" font-family="Arial" font-size="31" fill="#1e3a8a">'A'...'Z'</text><path d="M300 130H430" stroke="#2563eb" stroke-width="7"/><text x="330" y="105" font-family="Arial" font-size="25" fill="#2563eb">+32</text><rect x="430" y="90" width="230" height="80" rx="16" fill="#dcfce7"/><text x="485" y="142" font-family="Arial" font-size="31" fill="#166534">'a'...'z'</text><path d="M660 130H790" stroke="#0f766e" stroke-width="7"/><text x="690" y="105" font-family="Arial" font-size="25" fill="#0f766e">-32</text><rect x="790" y="90" width="230" height="80" rx="16" fill="#fef3c7"/><text x="845" y="142" font-family="Arial" font-size="31" fill="#92400e">same char</text><path d="M170 280H1030" stroke="#cbd5e1" stroke-width="6"/><text x="300" y="345" font-family="Arial" font-size="31" fill="#475569">letter? swap : unchanged</text></svg>
