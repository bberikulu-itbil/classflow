<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Cubic equation root</title><desc id="d">Binary search the unique real root by comparing function signs.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><path d="M90 285H1080" stroke="#475569" stroke-width="5"/><path d="M120 330C300 330 390 80 560 155S760 355 1040 80" fill="none" stroke="#2563eb" stroke-width="8"/><circle cx="560" cy="155" r="13" fill="#ef4444"/><text x="520" y="120" font-family="Arial" font-size="28" fill="#b91c1c">root</text><path d="M220 105H900" stroke="#0f766e" stroke-width="5" stroke-dasharray="14 10"/><text x="170" y="85" font-family="Arial" font-size="28" fill="#166534">L</text><text x="890" y="85" font-family="Arial" font-size="28" fill="#166534">R</text><text x="120" y="375" font-family="Arial" font-size="30" fill="#475569">f(L) and f(mid) same sign → L = mid, else R = mid</text></svg>
