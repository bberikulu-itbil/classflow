<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Euphonic word</title><desc id="d">Track consecutive vowels or consonants and insert the opposite type when the run reaches three.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="80" y="78" font-family="Arial" font-size="34" fill="#0f172a">scan left → right</text><rect x="100" y="130" width="180" height="70" rx="15" fill="#dbeafe"/><text x="160" y="175" font-family="Arial" font-size="28" fill="#1e3a8a">type</text><path d="M280 165H420" stroke="#2563eb" stroke-width="6"/><rect x="420" y="130" width="200" height="70" rx="15" fill="#fef3c7"/><text x="465" y="175" font-family="Arial" font-size="28" fill="#92400e">run++</text><path d="M620 165H760" stroke="#2563eb" stroke-width="6"/><rect x="760" y="130" width="220" height="70" rx="15" fill="#fee2e2"/><text x="805" y="175" font-family="Arial" font-size="28" fill="#b91c1c">run = 3?</text><path d="M980 165H1110M1045 165V275M1045 275H800" fill="none" stroke="#0f766e" stroke-width="6"/><text x="830" y="320" font-family="Arial" font-size="28" fill="#166534">answer++, run=1</text><text x="100" y="370" font-family="Arial" font-size="29" fill="#475569">vowel / consonant must not repeat 3 times</text></svg>
