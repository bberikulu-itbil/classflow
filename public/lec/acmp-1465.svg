<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Guess the number</title><desc id="d">Binary search narrows the interval after each comparison.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="70" y="80" font-family="Arial" font-size="34" fill="#0f172a">[L = 1 ---------------- R = 10⁹]</text><path d="M180 170H1030" stroke="#2563eb" stroke-width="12"/><circle cx="605" cy="170" r="18" fill="#ef4444"/><text x="575" y="135" font-family="Arial" font-size="28" fill="#b91c1c">mid</text><path d="M605 190V250M605 250H280M605 250H930" stroke="#0f766e" stroke-width="6"/><text x="180" y="305" font-family="Arial" font-size="29" fill="#475569">&lt; → R = mid-1</text><text x="760" y="305" font-family="Arial" font-size="29" fill="#475569">&gt; → L = mid+1</text><text x="400" y="375" font-family="Arial" font-size="31" fill="#166534">= → answer found</text></svg>
