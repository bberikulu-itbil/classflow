<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Uppercase conversion</title><desc id="d">Lowercase Latin letters move to uppercase; other characters stay unchanged.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><rect x="90" y="110" width="250" height="85" rx="18" fill="#dbeafe"/><text x="150" y="165" font-family="Arial" font-size="32" fill="#1e3a8a">'a' ... 'z'</text><path d="M340 152H570" stroke="#2563eb" stroke-width="8" marker-end="url(#a)"/><text x="405" y="120" font-family="Arial" font-size="28" fill="#2563eb">- 32</text><rect x="570" y="110" width="250" height="85" rx="18" fill="#dcfce7"/><text x="630" y="165" font-family="Arial" font-size="32" fill="#166534">'A' ... 'Z'</text><path d="M210 300H880" stroke="#cbd5e1" stroke-width="5"/><text x="300" y="355" font-family="Arial" font-size="31" fill="#475569">if lowercase → convert, else → keep</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs></svg>
