<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 244' width='820' height='244' role='img'><title>Гүлдердің орны: GCV → таңертең GVC → кешке VGC</title><rect width='820' height='244' fill='#ffffff'/><text x='20' y='30' font-family='Arial, Helvetica, sans-serif' font-size='20' font-weight='700' fill='#0f172a'>Бір күн = екі ауыстыру (K = 1)</text><rect x='30' y='70' width='56' height='56' rx='8' fill='#fce7f3' stroke='#db2777' stroke-width='2'/><text x='58.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>G</text><text x='58.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><rect x='96' y='70' width='56' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='2'/><text x='124.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>C</text><text x='124.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><rect x='162' y='70' width='56' height='56' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/><text x='190.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>V</text><text x='190.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><text x='30' y='150' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#475569'>басында (сол→оң)</text><rect x='300' y='70' width='56' height='56' rx='8' fill='#fce7f3' stroke='#db2777' stroke-width='2'/><text x='328.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>G</text><text x='328.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><rect x='366' y='70' width='56' height='56' rx='8' fill='#dbeafe' stroke='#dc2626' stroke-width='2'/><text x='394.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>V</text><text x='394.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><rect x='432' y='70' width='56' height='56' rx='8' fill='#ede9fe' stroke='#dc2626' stroke-width='2'/><text x='460.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>C</text><text x='460.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><text x='300' y='150' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#475569'>таңертең: ортаңғы ↔ оң</text><rect x='570' y='70' width='56' height='56' rx='8' fill='#dbeafe' stroke='#dc2626' stroke-width='2'/><text x='598.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>V</text><text x='598.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><rect x='636' y='70' width='56' height='56' rx='8' fill='#fce7f3' stroke='#dc2626' stroke-width='2'/><text x='664.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>G</text><text x='664.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><rect x='702' y='70' width='56' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='2'/><text x='730.0' y='100' text-anchor='middle' font-family='Consolas, Menlo, monospace' font-size='26' font-weight='700' fill='#0f172a'>C</text><text x='730.0' y='124' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#334155'></text><text x='570' y='150' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#475569'>кешке: сол ↔ ортаңғы</text><path d='M235,98 L275,98' stroke='#0f172a' stroke-width='3'/><path d='M275,98 l-9,-6 v12 z' fill='#0f172a'/><path d='M505,98 L545,98' stroke='#0f172a' stroke-width='3'/><path d='M545,98 l-9,-6 v12 z' fill='#0f172a'/><text x='30' y='200' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#0f172a'>K = 1 → VGC. Әр күн — үш орынды айналдыру,</text><text x='30' y='224' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#0f172a'>сондықтан 3 күннен кейін тәртіп қайталанады.</text></svg>