<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Inter,Arial,sans-serif"><rect x="0" y="0" width="640" height="330" rx="22" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><rect x="24" y="24" width="288" height="282" rx="18" fill="#E0F2FE" stroke="#2563EB" stroke-width="3"/><text x="168" y="64" font-size="18" fill="#2563EB" font-weight="900" text-anchor="middle">What percent is the part?</text><rect x="48" y="92" width="240" height="64" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="168" y="134" font-size="28" fill="#2563EB" font-weight="900" text-anchor="middle" font-family="ui-monospace,monospace">=B3/B2</text><text x="168" y="196" font-size="20" fill="#0F172A" font-weight="800" text-anchor="middle">25 / 80 → 31.25%</text><text x="168" y="250" font-size="17" fill="#64748B" font-weight="700" text-anchor="middle">part ÷ whole</text><text x="168" y="280" font-size="14" fill="#64748B" font-weight="500" text-anchor="middle">then Percent format</text><rect x="328" y="24" width="288" height="282" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/><text x="472" y="64" font-size="18" fill="#7C3AED" font-weight="900" text-anchor="middle">A percent of a number</text><rect x="352" y="92" width="240" height="64" rx="8" fill="#fff" stroke="#7C3AED" stroke-width="2"/><text x="472" y="134" font-size="28" fill="#7C3AED" font-weight="900" text-anchor="middle" font-family="ui-monospace,monospace">=B2*30%</text><text x="472" y="196" font-size="20" fill="#0F172A" font-weight="800" text-anchor="middle">80 × 30% → 24</text><text x="472" y="250" font-size="17" fill="#64748B" font-weight="700" text-anchor="middle">whole × percent</text><text x="472" y="280" font-size="14" fill="#64748B" font-weight="500" text-anchor="middle">% already divides by 100</text></svg>