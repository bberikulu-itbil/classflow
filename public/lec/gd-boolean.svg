<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Boolean амалдары</title><desc id="d">Union біріктіреді, Subtract үстіңгі фигураны алып тастайды, Intersect қиылысты қалдырады, Exclude қиылыспағанды қалдырады.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="0" y="0" width="1200" height="420" rx="24" fill="#f8fafc" stroke="none" stroke-width="0"/><defs></defs><g transform="translate(165 0)"><ellipse cx="-40" cy="190" rx="90" ry="90" fill="#2563eb" stroke="none" stroke-width="0"/><ellipse cx="40" cy="190" rx="90" ry="90" fill="#2563eb" stroke="none" stroke-width="0"/><text x="0" y="372" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Union</text></g><g transform="translate(465 0)"><defs><mask id="sb" maskUnits="userSpaceOnUse" x="-200" y="60" width="400" height="260"><rect x="-200" y="60" width="400" height="260" fill="#fff"/><ellipse cx="40" cy="190" rx="90" ry="90" fill="#000" stroke="none" stroke-width="0"/></mask></defs><g mask="url(#sb)"><ellipse cx="-40" cy="190" rx="90" ry="90" fill="#2563eb" stroke="none" stroke-width="0"/></g><ellipse cx="40" cy="190" rx="90" ry="90" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/><text x="0" y="372" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Subtract</text></g><g transform="translate(765 0)"><defs><clipPath id="ci"><ellipse cx="40" cy="190" rx="90" ry="90"/></clipPath></defs><g clip-path="url(#ci)"><ellipse cx="-40" cy="190" rx="90" ry="90" fill="#2563eb" stroke="none" stroke-width="0"/></g><ellipse cx="-40" cy="190" rx="90" ry="90" fill="none" stroke="#94a3b8" stroke-width="3"/><ellipse cx="40" cy="190" rx="90" ry="90" fill="none" stroke="#94a3b8" stroke-width="3"/><text x="0" y="372" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Intersect</text></g><g transform="translate(1050 0)"><defs><mask id="xa" maskUnits="userSpaceOnUse" x="-200" y="60" width="400" height="260"><rect x="-200" y="60" width="400" height="260" fill="#fff"/><ellipse cx="40" cy="190" rx="90" ry="90" fill="#000" stroke="none" stroke-width="0"/></mask><mask id="xb" maskUnits="userSpaceOnUse" x="-200" y="60" width="400" height="260"><rect x="-200" y="60" width="400" height="260" fill="#fff"/><ellipse cx="-40" cy="190" rx="90" ry="90" fill="#000" stroke="none" stroke-width="0"/></mask></defs><g mask="url(#xa)"><ellipse cx="-40" cy="190" rx="90" ry="90" fill="#2563eb" stroke="none" stroke-width="0"/></g><g mask="url(#xb)"><ellipse cx="40" cy="190" rx="90" ry="90" fill="#2563eb" stroke="none" stroke-width="0"/></g><text x="0" y="372" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">Exclude</text></g><text x="600" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">Екі фигураны таңда → жоғарғы тақтада Boolean түймесі</text></svg>
