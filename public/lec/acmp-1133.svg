<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Sequence sum</title><desc id="d">Add every non-zero number until the sentinel zero.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="80" y="80" font-family="Arial" font-size="34" fill="#0f172a">sum = 0</text><path d="M180 150H1000" stroke="#cbd5e1" stroke-width="6"/><rect x="150" y="120" width="130" height="65" rx="16" fill="#dbeafe"/><text x="190" y="163" font-family="Arial" font-size="28" fill="#1e3a8a">read x</text><path d="M280 152H430" stroke="#2563eb" stroke-width="6"/><rect x="430" y="120" width="180" height="65" rx="16" fill="#dcfce7"/><text x="462" y="163" font-family="Arial" font-size="28" fill="#166534">x ≠ 0</text><path d="M610 152H760" stroke="#2563eb" stroke-width="6"/><rect x="760" y="120" width="190" height="65" rx="16" fill="#fef3c7"/><text x="787" y="163" font-family="Arial" font-size="28" fill="#92400e">sum += x</text><path d="M855 185V275H280V185" fill="none" stroke="#0f766e" stroke-width="6"/><text x="885" y="240" font-family="Arial" font-size="24" fill="#b91c1c">x = 0 → stop</text><text x="420" y="360" font-family="Arial" font-size="32" fill="#166534">output sum</text></svg>
