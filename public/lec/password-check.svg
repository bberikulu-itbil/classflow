<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Password check</title><desc id="d">Check length, character categories and adjacent duplicates.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><rect x="70" y="145" width="220" height="80" rx="16" fill="#dbeafe"/><text x="125" y="195" font-family="Arial" font-size="31" fill="#1e3a8a">password</text><path d="M290 185H410M410 185V100M410 185V270" stroke="#2563eb" stroke-width="6"/><rect x="410" y="55" width="220" height="70" rx="14" fill="#dcfce7"/><text x="465" y="100" font-family="Arial" font-size="27" fill="#166534">length=N</text><rect x="410" y="235" width="220" height="70" rx="14" fill="#fef3c7"/><text x="450" y="280" font-family="Arial" font-size="27" fill="#92400e">categories</text><path d="M630 270H760M760 270V180M760 270V360" stroke="#0f766e" stroke-width="6"/><text x="780" y="187" font-family="Arial" font-size="27" fill="#166534">upper/lower/digit</text><text x="780" y="370" font-family="Arial" font-size="27" fill="#b91c1c">prev != current</text><text x="70" y="365" font-family="Arial" font-size="28" fill="#475569">all checks true → correct</text></svg>
