<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Quadratic equation</title><desc id="d">The algorithm checks the linear case and then the discriminant.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="70" y="72" font-family="Arial" font-size="34" fill="#0f172a">a·x² + b·x + c = 0</text><rect x="70" y="125" width="260" height="92" rx="18" fill="#dbeafe"/><text x="150" y="180" font-family="Arial" font-size="30" fill="#1e3a8a">a = 0?</text><path d="M330 170H465M395 170V285H520M395 170V70H520" fill="none" stroke="#2563eb" stroke-width="6"/><text x="420" y="60" font-family="Arial" font-size="24" fill="#0f766e">yes</text><text x="420" y="278" font-family="Arial" font-size="24" fill="#0f766e">no</text><rect x="520" y="25" width="250" height="92" rx="18" fill="#dcfce7"/><text x="580" y="80" font-family="Arial" font-size="27" fill="#166534">linear: -c/b</text><rect x="520" y="240" width="250" height="92" rx="18" fill="#fef3c7"/><text x="565" y="295" font-family="Arial" font-size="27" fill="#92400e">D = b² - 4ac</text><path d="M770 285H875M875 285V220M875 285V350M875 220H1030M875 350H1030" fill="none" stroke="#0f766e" stroke-width="6"/><text x="900" y="210" font-family="Arial" font-size="24" fill="#0f766e">D &lt; 0: 0</text><text x="900" y="380" font-family="Arial" font-size="24" fill="#0f766e">D ≥ 0: roots</text></svg>
