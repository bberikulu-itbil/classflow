<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Two circles</title><desc id="d">Compare the center distance with the sum and difference of radii.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><circle cx="260" cy="205" r="105" fill="#dbeafe" fill-opacity=".6" stroke="#2563eb" stroke-width="7"/><circle cx="505" cy="205" r="75" fill="#dcfce7" fill-opacity=".6" stroke="#0f766e" stroke-width="7"/><circle cx="260" cy="205" r="7" fill="#1e3a8a"/><circle cx="505" cy="205" r="7" fill="#166534"/><path d="M260 205H505" stroke="#475569" stroke-width="5" stroke-dasharray="12 10"/><text x="245" y="245" font-family="Arial" font-size="26" fill="#1e3a8a">C1</text><text x="490" y="245" font-family="Arial" font-size="26" fill="#166534">C2</text><text x="350" y="190" font-family="Arial" font-size="27" fill="#475569">d</text><text x="700" y="130" font-family="Arial" font-size="30" fill="#0f172a">|r1-r2| ≤ d ≤ r1+r2</text><path d="M700 175H1100" stroke="#cbd5e1" stroke-width="4"/><text x="700" y="240" font-family="Arial" font-size="28" fill="#475569">distance² → bounds² → YES / NO</text></svg>
