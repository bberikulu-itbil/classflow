<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Pen tool: нүктелер мен тұтқалар</title><desc id="d">Бір рет басу түзу нүкте қояды, басып сүйреу қисық нүкте мен тұтқа жасайды.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="0" y="0" width="1200" height="420" rx="24" fill="#f8fafc" stroke="none" stroke-width="0"/><path d="M120 320 L330 320" stroke="#2563eb" stroke-width="7" fill="none"/><path d="M330 320 C 470 320, 470 120, 640 120 S 860 320, 1040 200" stroke="#2563eb" stroke-width="7" fill="none"/><line x1="470" y1="320" x2="330" y2="320" stroke="#f97316" stroke-width="3"/><line x1="640" y1="120" x2="470" y2="120" stroke="#f97316" stroke-width="3"/><line x1="640" y1="120" x2="810" y2="120" stroke="#f97316" stroke-width="3"/><ellipse cx="470" cy="320" rx="10" ry="10" fill="#f97316" stroke="none" stroke-width="0"/><ellipse cx="470" cy="120" rx="10" ry="10" fill="#f97316" stroke="none" stroke-width="0"/><ellipse cx="810" cy="120" rx="10" ry="10" fill="#f97316" stroke="none" stroke-width="0"/><rect x="106" y="306" width="28" height="28" rx="0" fill="#fff" stroke="#1e293b" stroke-width="4"/><rect x="316" y="306" width="28" height="28" rx="0" fill="#fff" stroke="#1e293b" stroke-width="4"/><rect x="626" y="106" width="28" height="28" rx="0" fill="#fff" stroke="#1e293b" stroke-width="4"/><rect x="1026" y="186" width="28" height="28" rx="0" fill="#fff" stroke="#1e293b" stroke-width="4"/><rect x="30" y="356" width="360" height="52" rx="12" fill="#2563eb" stroke="none" stroke-width="0"/><text x="210" y="391" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">бір рет бас → түзу нүкте</text><rect x="405" y="356" width="390" height="52" rx="12" fill="#7c3aed" stroke="none" stroke-width="0"/><text x="600" y="391" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">басып сүйре → қисық нүкте</text><rect x="810" y="356" width="370" height="52" rx="12" fill="#16a34a" stroke="none" stroke-width="0"/><text x="995" y="391" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">жабу: бірінші нүктеге бас</text><text x="660" y="70" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#f97316" text-anchor="middle">● тұтқа (handle) қисықтың иілуін басқарады</text></svg>
