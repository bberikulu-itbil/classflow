<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Sequence maximum</title><desc id="d">Keep the largest value seen before zero.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="80" y="80" font-family="Arial" font-size="34" fill="#0f172a">1 → 7 → 9 → 0</text><path d="M130 155H930" stroke="#cbd5e1" stroke-width="6"/><circle cx="170" cy="155" r="20" fill="#2563eb"/><circle cx="420" cy="155" r="20" fill="#2563eb"/><circle cx="670" cy="155" r="20" fill="#2563eb"/><circle cx="920" cy="155" r="20" fill="#ef4444"/><text x="120" y="230" font-family="Arial" font-size="28" fill="#475569">max=1</text><text x="370" y="230" font-family="Arial" font-size="28" fill="#475569">max=7</text><text x="620" y="230" font-family="Arial" font-size="28" fill="#166534">max=9</text><text x="870" y="230" font-family="Arial" font-size="28" fill="#b91c1c">stop</text><path d="M150 315H1020" stroke="#0f766e" stroke-width="8"/><text x="430" y="370" font-family="Arial" font-size="32" fill="#166534">max = max(max, x)</text></svg>
