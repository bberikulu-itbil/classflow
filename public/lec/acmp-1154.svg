<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">IPv4 validation</title><desc id="d">Split into four parts and validate every numeric part from zero to 255.</desc><rect width="1200" height="420" rx="28" fill="#f8fafc"/><text x="80" y="85" font-family="Arial" font-size="35" fill="#0f172a">192 . 168 . 5 . 12</text><path d="M100 150H1080" stroke="#cbd5e1" stroke-width="6"/><rect x="90" y="190" width="210" height="70" rx="14" fill="#dbeafe"/><text x="140" y="235" font-family="Arial" font-size="29" fill="#1e3a8a">split '.'</text><path d="M300 225H430" stroke="#2563eb" stroke-width="6"/><rect x="430" y="190" width="270" height="70" rx="14" fill="#fef3c7"/><text x="475" y="235" font-family="Arial" font-size="29" fill="#92400e">4 parts?</text><path d="M700 225H830" stroke="#2563eb" stroke-width="6"/><rect x="830" y="190" width="270" height="70" rx="14" fill="#dcfce7"/><text x="870" y="235" font-family="Arial" font-size="29" fill="#166534">0 ≤ part ≤ 255</text><text x="250" y="350" font-family="Arial" font-size="34" fill="#475569">all valid → Good   |   otherwise → Bad</text></svg>
